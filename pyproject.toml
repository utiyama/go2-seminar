[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-seminar"
version = "0.1.0"
description = "Windows/macOS classroom exercises with MuJoCo Menagerie Unitree Go2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
# The classroom .venv is pinned by requirements.txt (hashes). These ranges also allow
# the ROS 2 environment (pixi.toml), where ROS pins numpy 1.26 and matplotlib differs.
dependencies = [
  "mujoco==3.3.7",
  "mujoco-menagerie==2026.9.0",
  "numpy>=1.26,<3",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
