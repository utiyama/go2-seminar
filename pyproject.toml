[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-seminar"
version = "0.1.0"
description = "Windows/macOS classroom exercises with MuJoCo Menagerie Unitree Go2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "mujoco==3.3.7",
  "mujoco-menagerie==2026.9.0",
  "numpy==2.2.6",
  "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
